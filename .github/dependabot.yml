version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: bleak # a new major version needs testing on a real camera first
        update-types: ["version-update:semver-major"]
    groups:
      python:
        patterns: ["*"]
