name: build

# Packaged apps. Builds are slow and use Actions minutes, so they don't run on every push.
#
# - By hand (Actions tab > build > Run workflow, or `gh workflow run build.yml`): builds and checks everything.
# - On a tag such as v0.1.0: also publishes to GitHub Releases and PyPI. See "Making a release" in CONTRIBUTING.md.
#
# Actions are pinned to commits because this workflow handles the app's signing key.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Read the version and check it against the tag
        id: version
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/quak/__init__.py)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match version $version"
            exit 1
          fi
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          twine check --strict dist/*
      - name: Check that the wheel works on its own
        run: |
          python -m venv "$RUNNER_TEMP/wheel"
          "$RUNNER_TEMP/wheel/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          wheel/bin/quak --version
          wheel/bin/quak --sim info
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package
          path: dist/

  linux:
    needs: python
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.python.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libmpv-dev mpv
          python -m pip install "flet[all]==1.1.0"
      - name: Build
        run: tools/build_app.sh linux
      - name: Package
        run: |
          mkdir out
          tar -czf "out/quak-$VERSION-linux-x86_64.tar.gz" --transform "s,^\.,quak-$VERSION," -C app/build/linux .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quak-linux
          path: out/

  windows:
    needs: python
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.python.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install "flet[all]==1.1.0"
      - name: Build
        shell: bash
        run: tools/build_app.sh windows
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory out | Out-Null
          Compress-Archive -Path app/build/windows/* -DestinationPath "out/quak-$env:VERSION-windows-x86_64.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quak-windows
          path: out/

  android:
    needs: python
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.python.outputs.version }}
      # Without these (in a fork, say) the APK gets a throwaway debug key, which is fine for trying a build
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      FLET_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Install
        run: python -m pip install "flet[all]==1.1.0"
      - name: Set up the signing key
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          base64 -d <<< "$ANDROID_KEYSTORE_BASE64" > "$RUNNER_TEMP/quak.p12"
          echo "FLET_ANDROID_SIGNING_KEY_STORE=$RUNNER_TEMP/quak.p12" >> "$GITHUB_ENV"
          echo "FLET_ANDROID_SIGNING_KEY_ALIAS=quak" >> "$GITHUB_ENV"
      - name: Build
        run: tools/build_app.sh apk
      - name: Package
        run: |
          mkdir out
          cp app/build/apk/quak.apk "out/quak-$VERSION-android-arm64.apk"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quak-android
          path: out/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [python, linux, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the release
    env:
      VERSION: ${{ needs.python.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: quak-*
          path: release
          merge-multiple: true
      - name: Publish the release
        run: |
          (cd release && sha256sum -- * > SHA256SUMS)
          awk -v heading="## $VERSION" '$0 == heading {found=1; next} /^## /{found=0} found' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" release/* --verify-tag --title "Quak $VERSION" --notes-file notes.md

  pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI's trusted publishing, so no PyPI password or token is stored here
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
