<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-label="Quak uses Bluetooth for control and the camera's Wi-Fi for preview and media. For a livestream, the camera joins a network you choose.">
  <style>
    text { font-family: Inter, Segoe UI, Helvetica, Arial, sans-serif; fill: #F2F4F7; }
    .t { font-size: 20px; font-weight: 600; }
    .s { font-size: 15px; fill: #A7AFBA; }
    .l { font-size: 15px; font-weight: 600; }
  </style>
  <rect width="960" height="430" rx="18" fill="#0B0D10"/>
  <rect x="40" y="140" width="210" height="150" rx="16" fill="#15181D" stroke="#2A2F37"/>
  <text class="t" x="145" y="205" text-anchor="middle">Quak</text>
  <text class="s" x="145" y="233" text-anchor="middle">your computer or phone</text>
  <rect x="520" y="140" width="210" height="150" rx="16" fill="#15181D" stroke="#2A2F37"/>
  <text class="t" x="625" y="205" text-anchor="middle">HERO11 Black</text>
  <text class="s" x="625" y="233" text-anchor="middle">the camera</text>
  <path d="M250 175 H520" stroke="#6EA8FE" stroke-width="3"/>
  <text class="l" x="385" y="115" text-anchor="middle" style="fill:#6EA8FE">Bluetooth, whenever connected</text>
  <text class="s" x="385" y="140" text-anchor="middle">controls, settings, status, schedule, clock</text>
  <text class="s" x="385" y="162" text-anchor="middle">Nothing else on your computer changes</text>
  <path d="M250 255 H520" stroke="#FFC531" stroke-width="3" stroke-dasharray="9 7"/>
  <text class="l" x="385" y="288" text-anchor="middle" style="fill:#FFC531">The camera's own Wi-Fi, only when needed</text>
  <text class="s" x="385" y="313" text-anchor="middle">live preview, media list, downloads, deleting</text>
  <text class="s" x="385" y="335" text-anchor="middle">On a computer, a Wi-Fi adapter joins the camera for a while</text>
  <path d="M730 215 H800" stroke="#3DD68C" stroke-width="3"/>
  <rect x="800" y="150" width="130" height="130" rx="16" fill="#15181D" stroke="#2A2F37"/>
  <text class="l" x="865" y="200" text-anchor="middle">Your Wi-Fi</text>
  <text class="s" x="865" y="224" text-anchor="middle">then the</text>
  <text class="s" x="865" y="244" text-anchor="middle">RTMP server</text>
  <text class="l" x="930" y="350" text-anchor="end" style="fill:#3DD68C">Livestream (experimental)</text>
  <text class="s" x="930" y="375" text-anchor="end">The camera itself joins and sends</text>
  <text class="s" x="930" y="395" text-anchor="end">the video: Quak only sets it up</text>
</svg>
