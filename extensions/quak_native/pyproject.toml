[project]
name = "quak-native"
version = "0.1.0"
description = "Quak's Bluetooth LE and Wi-Fi bridge for Flet apps on Android (universal_ble, wifi_iot)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["flet>=1.1.0"]

[tool.setuptools.package-data]
"flutter.quak_native" = ["**/*"]

[tool.setuptools]
license-files = ["LICENSE"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
